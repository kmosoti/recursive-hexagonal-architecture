# Crate-graph checker rules (spec §6.13; schema in docs/plan/IMPLEMENTATION-PLAN.md §5).
# Read by `cargo xtask architecture` from CHG-003 on. Protected surface: the
# allow-lists change only with Kennedy's approval.
#
# The allow-lists are EMPTY and stay empty until a product crate needs an
# entry (CHG-005). An empty allow-list is not a placeholder: it is the
# strictest possible statement, that no core crate may depend on anything
# external at all. Plan §5 shows the lists populated for the product this
# repository has not built yet; filling them in advance would allow
# dependencies no crate has asked for, and §11.1 asks each one to be
# justified when it arrives. Given as the §5 schema with empty lists by
# Kennedy, 2026-09-20 (CHG-003).
schema_version = 1

[classification]
# Total classification (§11.2): explicit [package.metadata.rha] role wins;
# else these prefixes; else these lists; else class.unclassified, which is an
# error and never a silent pass. A member matching a prefix AND declaring a
# conflicting role is class.prefix_role_conflict.
adapter_prefix = "adapter-"
app_prefix = "app-"
tools = ["xtask"]
harness = []
# Every other member MUST declare [package.metadata.rha] role =
# "core" | "adapter" | "app" | "tool" | "harness".

[core]
# External crates a core crate may depend on; purity is judged by review (§6.8).
# Empty: no core crate exists yet, and none may depend on anything external.
allow = []
# Dev-dependencies of a core crate. Empty for the same reason.
dev_allow = []
# A build script runs arbitrary code at build time, which is an ambient effect
# the deny list of CHG-001 cannot see (§4.1, Law 5 row).
allow_build_scripts = false

[adapters]
# Each owner named in a crate's metadata `implements` must be a normal
# dependency: an adapter that cannot name the port it claims to implement is
# adapter.missing_port_owner, and one that names it only as a dev-dependency
# is adapter.port_owner_wrong_kind.
require_port_owner_dependency = true
# An adapter depending on a core it does not implement a port for is a
# warning, not an error: it is legitimate for an adapter to use a shared
# core's types, and D1 constrains the direction, not the fact of the edge.
foreign_core_dependency = "warn"

# Forbidden edges, matched by glob on package names. `from` may be a package
# name or the selector `role:<role>`, which matches every crate classified
# with that role. None is declared: every forbidden edge in plan §5's example
# names a product crate, and no product crate exists until CHG-005. The
# section is documented rather than populated so that the first real entry is
# a reviewed decision, not a schema change.
#
# [[forbidden]]
# from = "library";   to = "notify";         reason = "change observation crosses SourceRepository"
# [[forbidden]]
# from = "site";      to = "pulldown-cmark"; reason = "parsing is document's decision"
# [[forbidden]]
# from = "role:core"; to = "tokio";          reason = "no runtime in cores"

[transitive]
# L2 mode: full dependency resolution (the §4.1 transitive hole). Disabled, so
# `cargo xtask architecture` reads `cargo metadata --no-deps` and sees direct
# edges only. EM-C01 of the corpus is registered as an expected miss for
# exactly this reason, and becomes a detection when this is true.
enabled = false
