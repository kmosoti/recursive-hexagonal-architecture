[package]
name = "xtask"
version = "0.1.0"
description = "Repository automation for RHA: lane runner, evidence records, generated docs"
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.rha]
role = "tool"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
