[package]
name = "xtask"
version = "0.1.0"
description = "Repository automation for RHA: lane runner, evidence records, generated docs"
edition.workspace = true
rust-version.workspace = true
publish = false

# No [package.metadata.rha] role. xtask is classified by the `tools` list in
# rha-crates.toml, which plan §5 makes the owner of that fact for tools and
# harnesses; plan §8 W5's acceptance expects `xtask: tool (list)`. Declaring
# the role here as well would state one fact in two places (§11.7.1), and the
# copy that lost would be silent — metadata wins over a list, so removing
# xtask from the list would stop having any effect.

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.57.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
