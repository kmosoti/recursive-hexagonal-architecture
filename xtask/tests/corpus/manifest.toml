]

[[case]]
id = "R01"
level = "crate"
generation = "declared"
expected = "detect"
rule = "rustc E0603"
cell = "law2-d3"
seeded = "core-b names core_a::private_mod::Item, a module core-a does not export"
# Detected by the compiler, not by xtask. Law 2 and the D3 crate cell need no
# rule of their own: the crate facade already makes a non-exported item
# unreachable. The harness runs `cargo check --offline` on this fixture and
# records the error code.
detector = "cargo check --offline"
witness = { error_code = "E0603", crate = "core-b", names = "core_a::private_mod::Item" }
# Both bodies are required. Without them the generated workspace compiles:
# core-a would define no private_mod::Item and core-b would name nothing, so
# `cargo check` would exit 0 and the registered detection could never fire.
# The module is private and the item inside it is pub, which is what makes the
# error E0603 (the module is not accessible) rather than E0616 (private field)
# or an unresolved-name error.
crates = [
  { name = "core-a", role = "core", body = "mod private_mod { pub struct Item; }" },
  { name = "core-b", role = "core", deps = [{ name = "core-a" }], body = "pub fn take(_: core_a::private_mod::Item) {}" },
]

