# ===========================================================================
# GRADING
#
# How a run turns observed findings into detected / missed / false alarm.
# This is what keeps H4 from grading itself generously: without it, "detected"
# can mean no more than "the checker said something".
# ===========================================================================

[grading]
# The three values below are the Executor's proposal, open at DP-1.1. They are
# the strict reading in each case, because a corpus that grades itself leniently
# measures nothing; if Kennedy relaxes one at review, the relaxation is recorded
# here and in the CHG-002 change record before CHG-004 runs against it.
proposed_by = "agent:executor"
open_at = "DP-1.1"

# A finding matches a witness when EVERY key of the case's `witness` table
# equals the finding's corresponding field. There is no list of which keys
# count, because `witness` holds only keys that count: prose was moved to
# `witness_notes` in CHG-002.1 so that no future key can be forgotten by a
# sentence. A finding carrying a field the witness does not mention is fine;
# a finding contradicting or omitting one the witness does mention is not.
detection_requires = "every key of the case's witness table must equal the finding's corresponding field; witness holds no prose, so there is no list of exempt keys, and a key added to a witness later is matched by construction"

# Recall and precision are scored separately, so an over-eager rule cannot be
# hidden by the case it happens to get right, and is not punished twice for one
# defect either.
extra_findings = "the case counts as detected, and every unmatched finding on that fixture is counted in the run's false_alarm total with the fixture id; neither number is derived from the other"

# The strong reading: a legitimate fixture is a claim that the checker stays
# quiet about the whole workspace, not only about one rule. `listed_as` is the
# exception the two cases L07 and M11 need — an edge the run must report as a
# fact without raising it — and a run that raises it fails the case.
no_alarm_scope = "any finding on the fixture fails the case, whatever its rule; a report carrying a witness `listed_as` key is a listed fact, not a finding, and a run that raises it as a finding fails the case instead"

# Not in question, and not yours to decide: these follow from §17 and §9.14.
miss_is_terminal = "A `detect` case that is not detected fails the harness run, and CHG-004 downgrades that §4.1 cell in docs/enforcement-map.md. It never edits this file."
expected_miss_surprise = "An `expected_miss` case that IS detected is recorded as a finding in the change record and raised with the acceptance authority. It is not silently re-registered as a detection."
