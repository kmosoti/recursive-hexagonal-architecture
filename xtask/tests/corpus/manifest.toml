# Pre-registered H4 corpus (CHG-002; plan §6).
#
# Committed BEFORE any checker code exists. Spec §17 fixes cases and
# thresholds before data; §9.14 keeps the assurance strategy honest. The merge
# commit of CHG-002 is the pre-registration identity every H4 evidence record
# cites, so a case whose `expected` changes after that merge is a
# re-registration and says so in its own change record. This file is a
# protected surface (.rha/policy.toml [surface] protected) for exactly that
# reason: it must not be possible to edit an expectation quietly after seeing
# what a checker does.
#
# A harness reads this file. It is never the harness's output: a miss
# downgrades the cell in docs/enforcement-map.md and fails the run; it does
# not edit a line here.
#
# ---------------------------------------------------------------------------
# GENERATION
#
# `generation = "declared"` means the fixture is built from this file alone:
# CHG-004 writes each crate's Cargo.toml and src/lib.rs from [[case]].crates
# and the case's rules overrides. No fixture workspace is committed, for the
# reason CHG-001.1 established — a committed copy drifts from the file that
# owns it, and the drift is silent.
#
# `generation = "authored"` means the seeded construct is Rust syntax that
# would be worse encoded in TOML than written as Rust (`impl
# crate::ordering::Trait for X`, a macro body, an `include!`). Those fixtures
# are authored in CHG-007 under xtask/tests/corpus/module/<id>/. Their ids,
# rules, cells and expected outcomes are pre-registered here all the same,
# which is what pre-registration is for.
#
# ---------------------------------------------------------------------------
# CRATE VOCABULARY (crate-level cases)
#
# Synthetic members: core-a, core-b, adapter-x, adapter-y, app-main, tool-t,
# harness-h, and the odd names a classification case needs. Each generated
# src/lib.rs holds `#[allow(unused_imports)] use <dep> as _;` for every
# declared dependency, so `cargo machete` raises no false alarm on a fixture.
# Each fixture workspace carries its own [workspace] table and is excluded
# from the root workspace.
#
# [[case]].crates entries:
#   name          required.
#   role          the value written to [package.metadata.rha] role. Omit it to
#                 write no metadata at all, which is what a classification
#                 case needs.
#   implements    [package.metadata.rha] implements = [...] (port paths).
#   build_script  true writes a build.rs.
#   body          Rust items appended verbatim to the crate's src/lib.rs. It
#                 holds items, not statements: R01 needs a private module in
#                 one crate and a reference to it from another, and EM-C02
#                 needs a call that the crate graph cannot see.
#   deps          dependency entries:
#     name        required.
#     kind        "normal" (default) | "dev" | "build".
#     source      "path" (default when the name is a member of this fixture's
#                 workspace) | "registry" (default otherwise).
#     version     for a registry dependency; "*" where the case does not care.
#     path        explicit path, for a dependency outside the workspace.
#     target      a cfg string, written as [target.'<cfg>'.dependencies].
#     optional    true writes `optional = true`.
#     rename      the key in Cargo.toml when it differs from the package name,
#                 written as `<rename> = { package = "<name>" }`.
#     inherit     true writes `<name>.workspace = true` and a matching
#                 [workspace.dependencies] entry.
#
# Classification follows the fixture's own rules file: the adapter and app
# prefixes, the tools and harness lists, then [package.metadata.rha] role.
# A member matching neither is unclassified, which is C10.
#
# ---------------------------------------------------------------------------
# WITNESS
#
# `witness` states what the finding must name for the case to count as
# detected. A rule id alone is too weak: a checker that reports
# dir.core_to_adapter for the wrong pair of crates would score a hit on C01
# while being wrong.
#
# EVERY key of `witness` is matched. Prose lives in `witness_notes`, which is
# matched against nothing and is there for the reader. The two were one table
# until CHG-002.1, and the grading rule then had to name which kinds of key
# counted — "every key naming a crate, port, module path or error code". That
# enumeration silently dropped the keys that carry an outcome rather than a
# name: `kind`, `matched_rule`, `depth` and above all `extraction`, so M20
# could be scored as detected by a checker reporting the cycle as exact when
# the case says a heuristic flag is required. Splitting the table removes the
# enumeration: a key is matched because of where it sits, not because a
# grading sentence remembered its name.

schema_version = 1
pre_registration = "CHG-002; the merge commit of this change is the identity H4 records cite"
plan_ref = "docs/plan/IMPLEMENTATION-PLAN.md §6"

# The §4.1 enforcement-map rows a case can belong to. `classification` is not
# a §4.1 row: total classification (§11.2) is the precondition for every row,
# and a member the checker cannot classify is a hole in all of them at once.
[cells]
"law2-d3" = "Law 2, D3: sovereignty"
"law3-d1" = "Law 3, D1: direction"
"d2" = "D2: never upward"
"law5" = "Law 5: explicit effects"
"law6-b3" = "Law 6, B3: no cycles"
"law6-d5" = "Law 6, D5: adapters only at roots"
"b4" = "B4: compatible contracts"
"classification" = "Not a §4.1 row: total classification (§11.2), the precondition for every row"

# The rules file (rha-crates.toml shape) generated into every crate-level
# fixture workspace, unless the case overrides it under [case.rules].
[rules_default]
adapter_prefix = "adapter-"
app_prefix = "app-"
tools = ["tool-t"]
harness = []
core_allow = []
core_dev_allow = []
core_allow_build_scripts = false
adapters_require_port_owner_dependency = true
transitive_enabled = false
forbidden_edges = []

# ===========================================================================
# CRATE LEVEL — violations (expected = "detect")
# ===========================================================================

[[case]]
id = "C01"
level = "crate"
generation = "declared"
expected = "detect"
rule = "dir.core_to_adapter"
cell = "law6-d5"
seeded = "core-a declares a normal dependency on adapter-x"
witness = { rule = "dir.core_to_adapter", from = "core-a", to = "adapter-x" }
crates = [
  { name = "core-a", role = "core", deps = [{ name = "adapter-x" }] },
  { name = "adapter-x" },
]

