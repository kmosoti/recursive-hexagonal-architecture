schema_version = 1

[adapters]
require_port_owner_dependency = true

[classification]
adapter_prefix = "adapter-"
app_prefix = "app-"
harness = []
tools = ["tool-t"]

[core]
allow = ["aws-sdk-s3"]
allow_build_scripts = false
dev_allow = []

[[forbidden]]
from = "core-a"
to = "aws-sdk-*"

[transitive]
enabled = false
