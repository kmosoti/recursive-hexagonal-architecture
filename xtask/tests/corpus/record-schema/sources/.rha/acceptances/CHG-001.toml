id = "D-001.1"
severity = "record integrity"
found_by = "human:kennedy"
found_at = "acceptance, 2026-09-19"
statement = """
`.rha/tasks/CHG-001-ambient-effect-deny-list.toml` shipped at 44b1e44 with \
the literal placeholder SPEC_DIGEST as the sha256 of its fifth \
instruction_sources entry, \
\"docs/spec/rha-spec-v0.10.md (CHG-001.3 corrected …)\". The record therefore \
asserted a witness it did not hold: a reader could not tell which revision of \
the specification the Executor worked from at the end of CHG-001.3, and the \
field's shape invited them to read the placeholder as a digest.\
"""
why_it_matters = """
An instruction_sources digest is what lets a later reader reproduce the \
Executor's inputs (§11.6.5). A placeholder in that position is the same class \
of error as an invented digest: both put an unverifiable string where a \
verifiable one belongs. It survived local and CI verification because no check \
reads task records; the policy's L0 lane has no record-schema check until \
CHG-019.\
"""
repair = """
Fixed in CHG-001.4: the field now reads \
bd96216829035ade64c43befa5e672c58078f6afa4b04145c6183227e4e1071a, the sha256 \
of docs/spec/rha-spec-v0.10.md at 44b1e44, which is the corrected §6.8 text \
the entry names. Verify with `git show 44b1e44:docs/spec/rha-spec-v0.10.md | \
sha256sum`.\
"""
follow_up = "A record-schema check that rejects a placeholder or a non-hex digest belongs to CHG-019; until then the acceptance review is the only control."

