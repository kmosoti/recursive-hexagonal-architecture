statement = """
.rha/tasks/CHG-002.2-acceptance-protocol.toml listed the plan under \
instruction_sources as "after this change" with sha256 42e6e00e06c1d3da…, which \
is the plan as of e7a60b1, the item's first commit to touch it. b2c5ee1 edited \
