# Acceptance record (spec §11.4, §11.7.6; §11.7.11 shape, stored as TOML).
#
# The first record written under .rha/policy.toml [acceptance] as that section
# intends it: the merge IS the acceptance, and this record is the first commit
# of the next work item. CHG-002's record was written in the same item it
# describes, because the rule did not exist until that item created it.
#
# Creating an acceptance record is pre-approved by [acceptance]
# (record_creation_preapproved = true). Editing an existing one is not.
