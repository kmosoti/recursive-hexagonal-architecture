[disposition]
decision = "accepted"
kind = "controlled_transition"
merge_allowed = false
basis = "spec §11.5 controlled transition, bounded by .rha/policy.toml [acceptance.bootstrap]. Authentic cannot hold until CHG-019 and CHG-020; Passed cannot hold until CHG-003 implements the checker. Applicable additionally fails because this subject edits the policy it is measured against."
eligibility_at_acceptance = "blocked"
exception = "none, and none possible: the failing check is non-waivable"

[[disposition.predicates]]
name = "Authentic"
holds = false
reason = "No trusted producers in .rha/policy.toml until CHG-019 and CHG-020; every record is advisory."

[[disposition.predicates]]
name = "Applicable"
holds = false
reason = """
The cited CI record reports policy_digest sha256:72bf2e52… against \
base_policy_digest sha256:5497c29e…, because this subject adds [acceptance] \
and protects .rha/decisions.toml. CI resolves base_revision from \
RHA_BASE_SHA, which on a merge commit is its FIRST parent, 15d916a — so a \
merge that changes the policy is always measured against the policy it \
replaced, and Applicable is false on the merge commit by construction. The \
transition closes one commit later: the first record whose base is 4be4a19 \
reports both digests as sha256:72bf2e52…. That is the record this work item \
will produce, and it is cited in CHG-003's own acceptance, not here. The same \
pattern holds for CHG-001 and CHG-002; it is a property of where the base is \
read, not a defect in any of the three changes.\
"""

[[disposition.predicates]]
name = "Complete"
holds = true
reason = "Every check of lane L0 appears in each record with a unique id."

[[disposition.predicates]]
name = "Passed"
holds = false
reason = "L0.architecture is not_run (not_implemented until CHG-003) and DP-0.5 makes every L0 check required and non-waivable."

