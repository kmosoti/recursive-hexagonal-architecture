question = "May the executor's process run the held-out checks, and where does the runner live?"
answer = "Yes, under the DP-1.1b amendment: Kennedy asked the executor to run the checks on his behalf, and asked the supervising session to make that compliant. The runner is `cargo xtask corpus held-out`, in the repository's one automation home; it prints opaque ids, exit statuses, finding counts and the commitment check, keeps raw reports outside the repository, and grades nothing. The executor's Python draft under scripts/ was not adopted: the plan's layout has no scripts/ directory, the tool baseline lists no Python, and the lane's checks do not cover it. The private cases have not been supplied to any agent at the time of this record; the run happens when Kennedy supplies the directory or the original archive, and is recorded as a post-acceptance observation graded by Kennedy."
decided_by = "human:kennedy (delegation and placement); agent:executor (implementation)"
date = "2026-09-20"

