[[decision]]
id = "DP-1.1b"
title = "Author two or three held-out crate-level corpus cases outside this repository (spec §9.14)"
status = "decided"
decided_by = "human:kennedy"
date = "2026-09-20"
answer = "The cases exist, in a directory outside this repository. Kennedy supplied their commitment in the working conversation before any checker code was written; this row is the second commit of CHG-003 and the first commit of that item touched no checker."
owner = "human:kennedy"
needed_by = "BEFORE CHG-003 starts: the commitment digest must be on this row before any checker code exists, or it cannot show the cases predate the checker (review finding on pull request 5). The cases themselves are run at CHG-004 acceptance."
blocks = ["CHG-003"]
unblocked_at = "The commit carrying this row. Every later commit of CHG-003 is checker code; every earlier one is this record and the CHG-002.2 acceptance."
cannot_default = true
how_to_close = """
Kennedy writes the cases in a directory outside this repository, in the \
manifest's declared shape or as ready workspaces, each with its expected \
outcome. He then records here, as `commitment`, the sha256 of a tar of that \
directory, without committing the cases, BEFORE CHG-003 starts; CHG-003 is \
blocked until this row carries a digest. The Executor never reads them. At \
CHG-004 acceptance Kennedy runs the checker on them himself and records the \
per-case outcomes in that acceptance record; the commitment lets anyone verify \
later that the cases predate the checker.\
"""
# The sha256 of a tar of Kennedy's held-out directory, supplied by him and
# recorded here before any checker code exists. The cases are NOT in this
# repository and no agent has read them or may read them (§9.14). What this
# digest buys: at CHG-004 acceptance Kennedy runs the checker on those cases
# himself and records the per-case outcomes, and anyone can then re-tar the
# directory and confirm it still hashes to this value — showing the cases were
# fixed before the checker existed, rather than adjusted once its behaviour
# was known. It binds the content, not the result.
#
# The Executor cannot verify this digest and does not claim to: it is Kennedy's
# assertion, recorded verbatim as he gave it. What the Executor can attest is
# the ordering, which is visible in this branch's history — this commit
# precedes every line of checker code in CHG-003.
commitment = "sha256:47868f629cab286f5476ad7c62737cbab8dace85fae463dcaa619dda18cea8bc"
commitment_recorded_at = "CHG-003, second commit, before any checker code"
commitment_verifiable_by = "human:kennedy only, by re-taring the held-out directory; the Executor never reads it"
# Amended in CHG-004.6: who operates the run.
amendment_date = "2026-09-20"
amendment_decided_by = "human:kennedy"
amendment_approved_in = "Kennedy's instruction of 2026-09-20 to the executor to run the held-out checks on his behalf, and his instruction to the supervising session that the runner belong under xtask, not in a scripts/ directory"
amendment_text = "The executor's process may run the accepted checker on the private cases through `cargo xtask corpus held-out`, which prints only opaque case ids, exit statuses, finding counts and the commitment check. Raw reports stay outside the repository. No agent reads the cases. Kennedy grades the observations against his expectations and records the per-case outcomes in the acceptance record. A run after the merge is recorded as a post-acceptance observation."
amendment_why = "Kennedy prefers not to open a terminal for the run. The property this row protects, that the cases were fixed before the checker existed and were never tuned to, holds as long as the checker under test is the accepted one and the grading stays Kennedy's."
commitment_command = "tar --sort=name --mtime='2026-09-20' --owner=0 --group=0 --numeric-owner -cf - -C <dir> . | sha256sum"


[[decision]]
id = "DP-1.1c"
title = "The three [grading] values of the corpus manifest"
status = "decided"
decided_by = "human:kennedy (merge of CHG-002.2)"
date = "2026-09-20"
answer = "The strict readings stand as written in CHG-002: detection_requires, extra_findings, no_alarm_scope. Relaxing one before CHG-004 runs is a protected edit of the manifest, recorded here first."
record = "xtask/tests/corpus/manifest.toml [grading]"
# Amended in CHG-004.6, after the data (option (a) of CHG-004's acceptance concern 1).
amendment_date = "2026-09-20"
amendment_decided_by = "human:kennedy"
amendment_approved_in = "the CHG-004.6 kickoff of 2026-09-20: \"C13: I choose (a). I approve the DP-1.1c amendment row and the C13 manifest amendment exactly as the goal states.\""
amendment_text = "A finding matching an entry of a case's expected_findings is a registered fact, neither a detection nor a false alarm."
amendment_scope = "detect cases; C13 is the only case that registers one: expected_findings = [{ rule = \"adapter.foreign_core\", crate = \"adapter-x\", to = \"core-b\" }]. Matching uses the every-key rule of witness. A registered fact never supplies a required detection."
amendment_disclosure = "Made after the data. CHG-004's H4 runs (evidence/h4-crate/20260920T122638Z-eec489c71f25.json and the baseline at 434b706) graded C13 failed on this exact warning. The warning was listed in plan §5 before any data existed, and C13's seeded shape, an adapter depending on a core whose port it does not implement, is its trigger; the registration, not the checker, was incomplete. The failed records are kept beside the amended run, and a V proposal built on the amended run carries this disclosure."


