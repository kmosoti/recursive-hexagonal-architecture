[[decisions]]
id = "protected-surface-approval"
question = "Which protected surfaces may this change touch?"
answer = "Three, each approved separately: .rha/acceptances/CHG-002.2.toml, whose creation is pre-approved by .rha/policy.toml [acceptance]; the DP-1.1b row of .rha/decisions.toml, approved in the working conversation of 2026-09-20; and rha-crates.toml, pre-approved in the same message to receive the plan §5 schema with empty allow-lists. No other protected surface may change."
decided_by = "human:kennedy"
date = "2026-09-20"

[[decisions]]
id = "held-out-commitment"
question = "DP-1.1b required the held-out commitment before any checker code. Is it recorded?"
answer = "Yes. The cases exist outside the repository and Kennedy supplied the commitment digest; it is on the DP-1.1b row as the second commit of this item, ahead of every line of checker code. The Executor never reads the cases and cannot verify the digest; it attests only the ordering, which the branch history shows."
decided_by = "human:kennedy"
date = "2026-09-20"

[[decisions]]
id = "checker-must-not-read-the-corpus"
question = "The corpus manifest declares every case the checker will be judged on. May the checker read it?"
answer = "No, and it is a non-goal for that reason. The manifest is an input to CHG-004's harness. A checker that reads its own test set can satisfy it without implementing the rule, which is what pre-registration exists to prevent (§17, §9.14)."
decided_by = "agent:executor, stated for Kennedy's review"
date = "2026-09-20"

[[decisions]]
id = "review-findings-chg-003.1"
question = "Which of the three automated review findings on pull request 6 (reviewed revision 776fa83) name a concrete failure on that revision, and what else does CHG-003.1 carry?"
answer = "All three do, and each is repaired in one commit: membership decided by package name let a registry crate sharing a member's name bypass [core] allow; [transitive] enabled = true removed the limitation while nothing evaluated the rule, so a requested check could report clean; foreign_core_dependency accepted any string and read a misspelling as warn. CHG-003.1 also carries what Codex's audit of the review history (2026-09-20) established and the supervising session's assessment proposed: the D-002.2.1 defect entry on .rha/acceptances/CHG-002.2.toml, for the stale plan digest in the CHG-002.2 task record that the review completing after the merge found; that digest corrected in the task record; three review rules in AGENTS.md and one bullet in CONTRIBUTING.md; and rows 8 and 9 of docs/proposals/spec-v0.11.md. Not carried: the repeated bootstrap objection, which names no new failure mode, so the bounded bootstrap stands; and any policy edit, since the controlled_transition label is queued, not changed. Kennedy's approval is his 'proceed' of 2026-09-20 on that written assessment, which listed these actions; it covers the one protected-surface edit [acceptance] does not pre-approve, the [[defects]] entry on an existing acceptance record, and no other protected surface changes in CHG-003.1."
decided_by = "human:kennedy"
date = "2026-09-20"

[[decisions]]
id = "review-findings-chg-003.1-follow-up"
question = "Which open findings on PR 6 at 4e33733 require another repair, and which authoring changes are authorized?"
answer = "Kennedy's current request explicitly asks for the open P1/P2 repairs and improvements to AGENTS.md, CONTRIBUTING.md and related agentic files. This authorizes the verifier repairs, those instruction files, a scoped xtask/AGENTS.md and the PR template. Seven open threads contain four distinct failures; duplicate comments are one repair obligation. All four were reproduced with the CLI on the reviewed revision before authoring: wrong member identity, malformed metadata and schema version 2 each exited 0; tool.git_rev was absent. The existing CHG-003.1 repairs remain history. No specification, policy, corpus, acceptance record, review setting or remote state change is included."
decided_by = "human:kennedy (scope and authorization); agent:codex (verified determinations)"
date = "2026-09-20"

[expectation]
# Written before the checker (spec §17: fixed before data).
detection = "Every crate-level `detect` case of xtask/tests/corpus/manifest.toml is detected, and none of the 11 legitimate cases raises an alarm. That is measured in CHG-004, not here; this item is judged on its unit tests and on the lane."
on_this_repository = "The workspace has one member, xtask, classified `tool` by the [classification] tools list. `cargo xtask architecture` exits 0 with `crates: 1 (xtask)` and no findings. A finding here would mean the checker misclassifies its own repository."
l0_architecture = "L0.architecture stops being not_run and becomes passed. It is the last of the eight L0 checks to run, so the Passed predicate can hold for the first time since CHG-000 — Authentic still cannot, until CHG-019 and CHG-020."
fallback_if_contradicted = "If `cargo metadata --no-deps` lacks a field a rule needs, switch to resolved mode with --offline --locked and record the mode in the report's subject.metadata_mode (plan §8 W3 replan)."

[claim]
affected_components = []
contract_changes = "none: no product component exists"
architecture_delta = "New xtask modules: metadata, and graph with model, classify, rules, check and report. No new dependency: cargo metadata output is parsed with the serde_json xtask already has. The CHG-003.1 follow-up adds a standard-library-only build script to the xtask tool to capture the compiled checker Git identity; these build-time Git reads add no core effect."
performance_impact = "none claimed"
unresolved = [
  "The checker runs over a workspace with one member. Its rules are exercised by unit tests on synthetic graphs and, in CHG-004, by the corpus; nothing in this repository exercises them on real crates until CHG-005.",
  "Authentic still cannot hold (CHG-019, CHG-020), so no record is Eligible even once Passed holds.",
  "An evidence record's agent_context.provenance is copied from the task record, not hashed from the tree (D-002.2.1 on the CHG-002.2 acceptance). A hand-entered digest that goes stale is echoed, not caught, until CHG-019's record lint compares cited digests with the subject tree.",
]

[acceptance]
criteria = [
  "Unit tests per rule id on synthetic CrateGraphs, including the classification precedence of plan §5 and the four dependency shapes C15 to C18 exercise",
  "`cargo xtask architecture` on this repository exits 0, reports one crate classified tool, and writes target/rha/architecture.json",
  "The JSON report carries the plan §5 field set, including module_checks with outcome not_run and limitations",
  "Exit codes as plan §5 fixes them: 0 no errors, 1 error findings, 2 usage or config error, 3 environment failure and never a pass",
  "L0.architecture reports passed in both a local and a CI record",
  "xtask/tests/policy_drift.rs still passes: the lane command block is unchanged",
  "The checker does not read xtask/tests/corpus/manifest.toml; a test asserts it",
]
replan_when = [
  "`cargo metadata --no-deps` lacks a needed field; switch to resolved mode with --offline --locked and record the mode",
  "A plan §5 rule id cannot be evaluated from no-deps metadata; it is reported as a limitation rather than silently omitted",
]

