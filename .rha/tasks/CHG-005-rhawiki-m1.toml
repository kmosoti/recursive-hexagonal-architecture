question = "May P-A add ledger rows DP-5.1 to DP-5.3 and record DP-1.2's default?"
answer = "Yes. Plan revision 2 §9, approved by the merge of PR 15, says the DP-5 rows are added in P-A's first stage. DP-1.2's row names 'start of CHG-005' as its trigger with default yes; recording a default at its trigger is pre-approved by [acceptance.ledger_edits]."
decided_by = "human:kennedy (plan approval); ledger_edits pre-approval"
date = "2026-09-22"

[[decisions]]
id = "held-out-check-kind-in-stage-3"
question = "Plan §8.1 P-A stage 0 lists `corpus held-out --kind check`. Where does it land?"
answer = "In stage 3. It wraps `rhawiki check`, which does not exist until stage 3; building it earlier would test a stub. Recorded here as a deviation from the stage list, not from the scope."
decided_by = "agent:executor"
date = "2026-09-22"

[[decisions]]
id = "dp-1.3"
question = "Gate DP-1.3: do the four refutation criteria stand?"
answer = "Kennedy chose 'Accept all four' when asked at the stage 1 gate on 2026-09-22; decomposition A. Recorded on the ledger before any product crate exists (§7.8 step 10)."
decided_by = "human:kennedy"
date = "2026-09-22"

[[decisions]]
id = "core-allow-list"
question = "Which external crates may core crates use? (rha-crates.toml is protected)"
answer = "Kennedy chose 'Approve as proposed' on 2026-09-22: [core] allow = pulldown-cmark, sha2, unicode-normalization; dev_allow = proptest; forbidden edges site -> pulldown-cmark, role:core -> tokio, library -> notify. Asked at the start of stage 2 rather than stage 3, because stage 2 cannot end green under L0.architecture without it."
decided_by = "human:kennedy"
date = "2026-09-22"

[[decisions]]
id = "site-module-rules"
question = "May P-A create crates/site/rha-modules.toml (protected)?"
answer = "Yes, with exactly the content plan §3.1 gives, which Kennedy approved with revision 2 (DP-5.1) and whose composite shape BDR-0003 accepted at DP-1.3."
decided_by = "human:kennedy (plan approval, DP-1.3)"
date = "2026-09-22"

[[decisions]]
id = "heading-attributes-off"
question = "The W5 brief lists pulldown-cmark's ENABLE_HEADING_ATTRIBUTES. Is it on?"
answer = "Off. It strips `{…}` from heading text, and the registered markdown contract derives slugs from the heading text as written; enabling it would make the product contradict a registration fixed before the code. Custom heading ids are not a Phase 1 feature."
decided_by = "agent:executor"
date = "2026-09-22"

[[decisions]]
id = "slug-without-nfc"
question = "Stage 4's first corpus run failed site MD051: the registered contract derives slugs without NFC, and the W5 brief says NFC. Which governs?"
answer = "The registered contract. It was committed before any product code and it grades the product (§2.4 rule 2); page ids stay NFC as both say. Disclosed defect: the Executor wrote the registration's contract from the W5 brief and dropped the brief's NFC for slugs, so the two documents disagree. The product now follows the registration. For Kennedy at acceptance: the plan brief's slug wording should be read as superseded by the registration, or amended in revision 3."
decided_by = "agent:executor"
date = "2026-09-22"

[[decisions]]
id = "site-scoped-guide"
question = "May P-A create crates/site/AGENTS.md (protected by **/AGENTS.md)?"
answer = "Yes: the W5 brief (plan §8.2), approved with revision 2 at DP-5.1, lists `site` with `rha-modules.toml` and a scoped AGENTS.md (§11.7.3). The scope guard flagged it before this decision was recorded; recorded here, before the PR."
decided_by = "human:kennedy (plan approval, DP-5.1)"
date = "2026-09-22"

[[decisions]]
id = "review-round-1"
question = "Codex (gpt-6-astra, extra-high) requested changes on 3c4a41f with 11 findings. Which are concrete failures?"
answer = "All 11; determinations in the change record under 'Review round 1'. Repaired in the next commit, determination first (M6)."
decided_by = "agent:executor (under the AGENTS.md review rules)"
date = "2026-09-22"

