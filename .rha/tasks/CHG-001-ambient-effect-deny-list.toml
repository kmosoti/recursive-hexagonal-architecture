[[decisions]]
id = "close-the-attribute-escape"
question = "Close the attribute escape by forbidding the three lints in the root Cargo.toml?"
answer = "Instructed, then refused by the toolchain: clap's derives expand to a group allow, which is E0453 under forbid, so xtask stopped compiling. Closed per core crate instead, with a crate-root #![forbid(...)] that the rule effect.core_clippy_template checks (experiments 7a to 7c)."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "protect-cargo-config"
question = "`--cap-lints=warn` in .cargo/config.toml disables every lint. Should that file be a protected surface?"
answer = "Yes. It is added to [surface] protected, which changes the policy digest and makes the next record report Applicable false until this change is on main (§11.5 controlled transition)."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "spec-research-update"
question = "Record the Clippy findings in the specification?"
answer = "Yes, then corrected on the same day. The first edit put an observation table in §6.8, which duplicated ADR-0002 against the one-owner rule of §11.7.1. §6.8 now keeps the normative consequence and a pointer; the proposals are queued in docs/proposals/spec-v0.11.md for the version bump, together with the rule that a work item does not edit the specification. The §1.4 maturity table stays untouched; Kennedy promotes those rows at a version bump."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "protected-surface-approval"
question = "Which protected surfaces may this change touch?"
answer = "Only the creation of xtask/templates/core-clippy.toml; no other protected surface may change. Extended on the same day by the deny-list-gaps decision above, which approves editing that same file to close the gaps ADR-0002 names; no other protected surface may change."
