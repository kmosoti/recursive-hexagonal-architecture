[expectation]
# Written before any experiment ran (plan §8 W1). The recorded rule is whatever is observed.
discovery = "Clippy reads the first clippy.toml found from the crate's CARGO_MANIFEST_DIR upward; a core crate's local file applies to it and not to a sibling adapter."
merge = "No merge: the nearest file replaces the root file entirely, so a core crate's clippy.toml loses the root test allowances unless it repeats them."
fallback_if_contradicted = "Record the observed rule; switch to CLIPPY_CONF_DIR per crate set by `xtask ci` (environment, not command, so §12.1 stays intact)."

[claim]
affected_components = []
contract_changes = "none: no product component exists"
architecture_delta = "A new xtask module (clippy_template) and test-only corpus workspaces excluded from the root workspace. No new dependency."
performance_impact = "none claimed"
unresolved = [
  "L0.architecture is still not_run, and it is required and non-waivable (DP-0.5), so this change cannot be Eligible under the current policy (CHG-000 acceptance concern 2).",
]

[acceptance]
criteria = [
  "(1) In xtask/tests/corpus/clippy/core-seeded, `cargo clippy -p core-a` exits nonzero citing clippy::disallowed_methods for the seeded SystemTime::now()",
  "(2) In xtask/tests/corpus/clippy/discovery, `cargo clippy -p adapter-x` passes with no deny-list finding",
  "(3) With allow-unwrap-in-tests only in the fixture's root clippy.toml and a test unwrap() in core-a, whether unwrap_used fires is observed and recorded",
  "Commands and captured stderr are in evidence/w1-clippy/; ADR-0002 states the observed rule and its consequence for per-core clippy.toml files",
  "(CHG-001.1 restatement, same experiments) The criteria above name the committed fixture workspaces of W1. The fixtures are now generated under target/clippy-corpus/ from the root Cargo.toml lint tables, the root clippy.toml, and the template, and the crates are named core-seeded, core-deny-only, core-clean, core-every and adapter-x. Experiments 1, 2 and 3 keep their meaning and their commands, which each record states in full.",
  "(CHG-001.2) Experiment 6 records what switches the deny list off, and experiment 4 shows every template entry resolve and fire.",
]
replan_when = [
  "Experiment (2) or (3) contradicts the expected rule",
  "A deny-list path does not resolve in Clippy 0.1.98",
]

