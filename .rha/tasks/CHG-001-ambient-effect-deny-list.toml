answer = "Ignore it."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "fixture-shape"
question = "The corpus held two committed fixture workspaces, eight Clippy configuration files, and drift tests that keep the copies aligned. Generate the fixtures from the owning files instead?"
answer = "Generate them (CHG-001.1)."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "allow-attribute-experiment"
question = "A #[allow(clippy::disallowed_methods)] in a core crate switches the deny list off, and Clippy's own help text suggests it. Run an experiment on that escape hatch?"
answer = "Yes, as part of CHG-001.2."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "architecture-check-timing"
question = "Move a minimal L0.architecture into W1 so the lane has no not_run check, or leave it not_run until CHG-003?"
answer = "Leave it not_run: a W1 version would pass over zero core crates, it would not change eligibility while Authentic fails, and it would put checker code before the corpus pre-registration of W2."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "deny-list-gaps"
question = "ADR-0002 lists known effectful paths the template does not cover. Extend the template, which is a protected surface?"
answer = "Yes: address the gaps of ADR-0002 in CHG-001.2. This is the approval to edit xtask/templates/core-clippy.toml for that purpose."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "executor-identity"
question = "Is the Executor one named model?"
answer = "No: the designation of Claude Opus 5 as the sole executing agent is withdrawn. The Executor is model-agnostic; the model and harness are provenance."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "protected-surface-approval"
question = "Which protected surfaces may this change touch?"
answer = "Only the creation of xtask/templates/core-clippy.toml; no other protected surface may change. Extended on the same day by the deny-list-gaps decision above, which approves editing that same file to close the gaps ADR-0002 names; no other protected surface may change."
decided_by = "human:kennedy"
date = "2026-09-19"

