[[decisions]]
id = "settings-file"
question = "The untracked .claude/settings.json makes every local record dirty. Commit it or ignore it?"
answer = "Ignore it."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "fixture-shape"
question = "The corpus held two committed fixture workspaces, eight Clippy configuration files, and drift tests that keep the copies aligned. Generate the fixtures from the owning files instead?"
answer = "Generate them (CHG-001.1)."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "allow-attribute-experiment"
question = "A #[allow(clippy::disallowed_methods)] in a core crate switches the deny list off, and Clippy's own help text suggests it. Run an experiment on that escape hatch?"
answer = "Yes, as part of CHG-001.2."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "architecture-check-timing"
question = "Move a minimal L0.architecture into W1 so the lane has no not_run check, or leave it not_run until CHG-003?"
answer = "Leave it not_run: a W1 version would pass over zero core crates, it would not change eligibility while Authentic fails, and it would put checker code before the corpus pre-registration of W2."
decided_by = "human:kennedy"
date = "2026-09-19"

