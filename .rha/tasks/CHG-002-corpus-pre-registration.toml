[[decisions]]
id = "protected-surface-approval"
question = "Which protected surfaces may this change touch?"
answer = "Only the one line in .rha/policy.toml that adds xtask/tests/corpus/manifest.toml to [surface] protected. No other protected surface may change."
decided_by = "human:kennedy"
date = "2026-09-19"

[[decisions]]
id = "manifest-is-generative"
question = "Should the manifest describe cases in prose, or declare enough structure that the fixture workspaces can be generated from it?"
answer = "Generative: CHG-004 must be able to build each crate-level fixture workspace from the manifest alone. This follows the CHG-001.1 decision that fixtures are generated from their owning file rather than committed as copies that drift."
decided_by = "human:kennedy"
date = "2026-09-19"

[expectation]
# Written before the manifest (plan §17: cases and thresholds fixed before data).
pre_registration_identity = "The merge commit of this change is cited by every H4 record as the revision at which the cases and their expected outcomes were fixed. A case whose `expected` changes after that merge is a re-registration and says so in its own change record."
detection_target = "CHG-004 must detect all 21 crate-level violations and raise no alarm on the 11 legitimate cases. A miss or an unexplained alarm fails the harness and downgrades the cell in docs/enforcement-map.md; it does not edit this manifest."
expected_miss_discipline = "EM-C01, EM-C02, EM-M01, EM-M02 and EM-M03 are registered as misses now, each citing the §4.1 hole that explains it. If CHG-004 detects one anyway, that is a finding to record, not a correction to make here."
fallback_if_contradicted = "A case that cannot be expressed in the generator's vocabulary is re-registered with the reason in the change record, before CHG-004 runs. The manifest is a protected surface precisely so that this cannot happen quietly."

[claim]
affected_components = []
contract_changes = "none: no product component exists"
architecture_delta = "A new xtask module (corpus) holding the manifest types and their validation. No runner, no new dependency: the manifest is TOML, read by the toml crate xtask already uses."
performance_impact = "none claimed"
unresolved = [
  "L0.architecture is still not_run and is required and non-waivable (DP-0.5), so this change cannot be Eligible either (CHG-001 acceptance, carried_forward 1).",
  "DP-1.1: Kennedy reviews the manifest and authors two or three held-out crate-level cases outside this repository. The held-out cases are the only part of H4 the Executor does not write, and they are what make the acceptance more than self-assessment.",
]

[acceptance]
criteria = [
  "Every case of plan §6 appears exactly once, with id, level, seeded, rule, cell, expected, and a witness the finding must name",
  "Every case with expected = \"expected_miss\" cites the §4.1 hole that explains the miss",
  "Every crate-level case declares its workspace: each crate's name, role source, dependencies with their kind, and any rules-file override",
  "The schema test fails on a manifest that is missing a plan §6 case, repeats an id, names an unknown rule or cell, or omits a hole citation on an expected miss",
  "`cargo xtask ci` reports the same outcomes as on main, with L0.architecture still not_run",
  "DP-1.1: Kennedy reviews the manifest and confirms his held-out cases exist",
]
replan_when = [
  "A plan §6 case cannot be expressed declaratively; it is then described in prose with the reason, and CHG-004 builds that one by hand",
  "The generation vocabulary needs a Cargo feature this toolchain does not support",
]

