# Module rules of the composite `site` (plan §3.1, §6.13; BDR-0003).
# Enforced by `cargo xtask architecture` once the module-graph check exists
# (P-C, CHG-007); until then by review, as BDR-0003 records.
[components]
assembly = "site::assembly"
build    = "site::build"

[allow]
build    = ["assembly"]
assembly = []

[deny]
cycles = true
child_to_parent_private = true
foreign_internal = true
