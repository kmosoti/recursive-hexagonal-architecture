# L2 scheduled lane (spec §12.1). Membership is in .rha/policy.toml; a check
# with no approved command is recorded not_run, never skipped silently.
name: assurance

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2:
    name: assurance-l2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: L2 lane
        env:
          RHA_BASE_SHA: ${{ github.event.before }}
        run: cargo xtask ci --lane L2 --label ci --record target/rha

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rha-assurance-evidence
          path: |
            target/rha/*.json
            target/rha/logs/
          if-no-files-found: warn
          retention-days: 90
